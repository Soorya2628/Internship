<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send me a message 1</title>
    <!-- Font Awesome Link for the Paper Plane Icon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Base Reset & Background Setup */
        body {
            background-color: #f0f2f5; /* Light gray background to show off the white card */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif; /* Matching the serif headline style */
        }

        /* White Main Card Container */
        .form-card {
            background-color: #fbfbfb;
            width: 100%;
            max-width: 620px;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Form Heading Title */
        .form-card h2 {
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Main Form Element Layout wrapper */
        .contact-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Dual Row Grid Configurator */
        .form-row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .form-row .input-group {
            flex: 1;
        }

        /* Standard Input Field Configurations */
        .form-control {
            width: 100%;
            background-color: #f3f4f7;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 15px;
            color: #333333;
            box-sizing: border-box;
            font-family: sans-serif; /* Clean sans-serif placeholders */
            transition: all 0.2s ease;
        }

        /* Subtle focus state ring animation outline */
        .form-control:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #bfa100;
            box-shadow: 0 0 0 3px rgba(191, 161, 0, 0.1);
        }

        /* Custom Placeholder Styling values */
        .form-control::placeholder {
            color: #8c8c8c;
            opacity: 1;
        }

        /* Message Box Area element height specs */
        textarea.form-control {
            height: 140px;
            resize: none;
        }

        /* Centered CTA Action Button Element Styles */
        .submit-btn-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn {
            background-color: #bfa100; /* Distinct dark mustard gold shade */
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #a38900;
        }

        .submit-btn i {
            font-size: 15px;
            transform: rotate(-10deg); /* Angled plane appearance tilt adjustment */
        }

        /* Responsive Breakdowns for Mobile Phone displays */
        @media (max-width: 540px) {
            .form-card {
                padding: 25px 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Card Structural Component Grid -->
    <div class="form-card">
        <h2>Send me a message</h2>
        
        <form class="contact-form" action="#" method="POST">
            <!-- Full Width Row: Company Name -->
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Enter Your Name / Company *" required>
            </div>

            <!-- Half-Width Split Row Elements -->
            <div class="form-row">
                <div class="input-group">
                    <input type="email" class="form-control" placeholder="Enter Your Email *" required>
                </div>
                <div class="input-group">
                    <input type="tel" class="form-control" placeholder="Enter Phone Number *">
                </div>
            </div>

            <!-- Full Width Row: Message Area Component Block -->
            <div class="input-group">
                <textarea class="form-control" placeholder="Write Message..."></textarea>
            </div>

            <!-- Centered Send Submission Element Button -->
            <div class="submit-btn-wrapper">
                <button type="submit" class="submit-btn">
                    Send Message <i class="fa-regular fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
